[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-scheduler"
version = "0.1.0"
description = "A deterministic, subscription-aware coding agent scheduler"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Takuro Tsujikawa" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/takurot/agent-scheduler"
Repository = "https://github.com/takurot/agent-scheduler"
Documentation = "https://github.com/takurot/agent-scheduler/blob/main/docs/RUNBOOK.md"
Issues = "https://github.com/takurot/agent-scheduler/issues"

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
subsched = "subsched.cli:app"
agent-scheduler = "subsched.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/subsched"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["subsched"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["subsched"]
