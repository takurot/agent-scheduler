github:
  repo: owner/project
  # Optional. Omit to resolve the repository default branch via GitHub.
  # base_branch: develop
  # Multiple include_labels use AND semantics (all labels required)
  include_labels:
    - ai-ready
  # Multiple exclude_labels use OR semantics (any label causes exclusion)
  exclude_labels:
    - blocked
    - human-only
    - security-sensitive
  completion:
    create_pr: true
    # When true, appends "Closes #<issue>" to PR body so the issue automatically closes upon PR merge
    close_issue: false

# Supported agents: claude, codex. At least one agent must remain enabled.
agents:
  claude:
    enabled: true
    priority: 100
    # Optional (#296). Per-execution-stage model selection. All keys are optional;
    # `default` is used for any stage without its own entry, and a stage/agent with no
    # model configured at all uses the provider CLI's own default (no --model flag is
    # added). Model names are examples only -- set real model identifiers your Claude
    # subscription supports; the installed CLI must advertise `--model` support, or
    # preflight fails closed instead of silently dropping the flag.
    # models:
    #   default: sonnet
    #   planning: opus
    #   plan_review: opus
    #   implementation: sonnet
    #   pr_review: opus
    #   revision: sonnet
  codex:
    enabled: true
    priority: 90
    # Optional (#296). Same stage keys as agents.claude.models; resolution order is
    # stage-specific model, then `default`, then the provider CLI's own default.
    # models:
    #   default: standard-model
    #   planning: advanced-model
    #   plan_review: advanced-model
    #   implementation: standard-model
    #   pr_review: advanced-model
    #   revision: standard-model

routing:
  strategy: capacity-aware
  provider_capacity:
    preferred: true
  local_estimate:
    proactive_switch: false

execution:
  concurrency: 1
  max_agent_switches: 6
  max_tasks_per_run: 50
  pause_running_policy: continue

queue:
  priority:
    label_scores: {}
    tie_break: issue_number_asc

# Each command runs directly (not through a shell) inside the task worktree, so it
# must resolve on PATH there. The default below (bare pytest/ruff) assumes those are
# already on PATH. For a uv-managed Python project (like this repository), bare
# `pytest`/`ruff` are only installed inside .venv and won't resolve unless it's
# activated -- prefix commands with `uv run` instead:
#   verification:
#     commands:
#       - uv run pytest
#       - uv run ruff check .
verification:
  commands:
    - pytest
    - ruff check .

billing:
  api_fallback: false
  metered_usage: false
  unknown_mode: disable

# Required for native execution. Both images must be locally available and pinned
# by RepoDigest. The proxy container name is the proxy_url hostname; it must be the
# only container attached to the internal network before dispatch and must also have
# an outbound network. Its pinned image owns the provider-domain allowlist policy.
# Provider auth directories must be absolute, mode 0700, contain only regular files
# mode 0600, and contain no Scheduler GitHub/SSH credentials.
isolation:
  backend: container
  runtime: docker
  image: registry.example/subsched-worker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  network: subsched-provider-internal
  proxy_url: http://subsched-provider-proxy:3128
  proxy_image: registry.example/subsched-proxy@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  auth:
    claude: /absolute/path/to/dedicated/claude-auth
    codex: /absolute/path/to/dedicated/codex-auth

# Optional (defaults shown below apply when `workflow:` is omitted entirely).
# mode: multi-stage opts in to a PLANNING -> PLAN_REVIEW gate before IN_PROGRESS: a
# READY task is first dispatched to write an implementation plan (.ai/plans/<issue>.md,
# never committed), then a read-only Plan Reviewer either approves it (-> IN_PROGRESS)
# or requests changes (-> back to PLANNING, up to max_plan_revisions before failing
# closed to NEEDS_HUMAN).
workflow:
  mode: standard
  stages:
    planning: true
    plan_review: true
  limits:
    max_plan_revisions: 2
