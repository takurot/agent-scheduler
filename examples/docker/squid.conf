# Subscription-provider HTTPS allowlist. Keep this list explicit: adding the
# metered OpenAI API endpoint would violate subsched's subscription-only policy.
http_port 3128
pid_filename none

acl SSL_ports port 443
acl CONNECT method CONNECT
acl provider_subscription_domains dstdomain api.anthropic.com chatgpt.com auth0.openai.com

# HTTPS tunnels only. IP literals and every hostname absent from the ACL fail
# closed. Squid does not intercept TLS, so provider certificates remain end to end.
http_access deny !SSL_ports
http_access deny !CONNECT
http_access allow CONNECT provider_subscription_domains
http_access deny all
