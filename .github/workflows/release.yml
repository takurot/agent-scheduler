name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=subsched --cov-report=term-missing --cov-fail-under=80
      - run: uv export --frozen --no-hashes --no-emit-project | uvx pip-audit -r /dev/stdin

  pypi-publish:
    name: Upload release to PyPI
    needs: quality-gate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-scheduler
    permissions:
      id-token: write  # Mandatory for Trusted Publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build package distributions
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
