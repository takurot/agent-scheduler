<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>subsched dashboard</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem; background: #14161a; color: #e6e6e6; }
  h1 { font-size: 1.3rem; margin-bottom: 0.25rem; }
  .banner { background: #7a1f1f; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; display: none; }
  .banner.show { display: block; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .card { background: #1f232a; border-radius: 8px; padding: 1rem; }
  .card h2 { font-size: 0.9rem; text-transform: uppercase; opacity: 0.7; margin: 0 0 0.5rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid #2c313a; }
  .kanban { display: flex; gap: 0.75rem; overflow-x: auto; }
  .column { background: #1f232a; border-radius: 8px; padding: 0.75rem; min-width: 180px; }
  .column h3 { font-size: 0.8rem; margin: 0 0 0.5rem; opacity: 0.8; }
  .task-chip { display: block; width: 100%; border: 0; color: inherit; text-align: left; font: inherit; background: #2c313a; border-radius: 4px; padding: 0.3rem 0.5rem; margin-bottom: 0.4rem; font-size: 0.8rem; cursor: pointer; }
  .task-chip:focus-visible { outline: 2px solid #9bc8ff; outline-offset: 2px; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 0.8rem; background: #14161a; padding: 0.75rem; border-radius: 6px; }
</style>
</head>
<body>
<h1>subsched dashboard</h1>
<div id="banner" class="banner"></div>
<div class="grid">
  <div class="card"><h2>Status</h2><div id="status-summary">loading...</div></div>
  <div class="card"><h2>Capacity</h2><div id="capacity-summary">loading...</div></div>
  <div class="card"><h2>Metrics</h2><div id="metrics-summary">loading...</div></div>
</div>
<div class="card">
  <h2>Kanban</h2>
  <div id="kanban" class="kanban"></div>
</div>
<div class="card" style="margin-top: 1rem;">
  <h2>Task History</h2>
  <label for="history-filter">Task history filter</label>
  <select id="history-filter">
    <option value="all">All</option>
    <option value="active">Active</option>
    <option value="terminal">Terminal</option>
  </select>
  <p id="history-count"></p>
  <div id="history"></div>
</div>
<div class="card" id="detail-card" style="display:none; margin-top: 1rem;">
  <h2>Task Detail</h2>
  <div id="detail-body"></div>
</div>

<script nonce="__DASHBOARD_NONCE_PLACEHOLDER__">
window.__DASHBOARD_INTERVAL__ = __DASHBOARD_INTERVAL_PLACEHOLDER__;
</script>
<script nonce="__DASHBOARD_NONCE_PLACEHOLDER__">
(function () {
  var token = new URLSearchParams(location.search).get("token") || "";
  var lastRevision = null;
  var polling = false;
  var selectedIssue = null;
  var detailRequest = 0;
  var detailAbort = null;
  var lastKanban = null;
  var historyTasks = [];
  var historyFilter = document.getElementById("history-filter");
  historyFilter.onchange = renderHistory;

  function isTerminal(task) {
    return ["COMPLETE", "FAILED", "CANCELLED"].indexOf(task.status) !== -1;
  }

  function renderHistory() {
    var filter = historyFilter.value;
    var tasks = historyTasks.filter(function (task) {
      return filter === "all" || (filter === "active" && !isTerminal(task)) ||
        (filter === "terminal" && isTerminal(task)) || task.status === filter;
    });
    document.getElementById("history-count").textContent = tasks.length + " tasks";
    var container = document.getElementById("history");
    container.textContent = "";
    tasks.forEach(function (task) {
      var row = document.createElement("div");
      var button = document.createElement("button");
      button.type = "button";
      button.textContent = "View #" + task.issue_number + " " + task.title;
      button.onclick = function () { loadDetail(task.issue_number); };
      row.appendChild(button);
      var summary = document.createElement("p");
      summary.textContent = task.status + " | Updated: " + (task.updated_at || "—") +
        " | Agent: " + (task.current_agent || "—") +
        " | PR " + (task.pr != null ? "#" + task.pr : "—") +
        " | CI: " + (task.ci_result || "—") +
        " | Completion: " + (task.completion_kind || "—");
      row.appendChild(summary);
      container.appendChild(row);
    });
  }

  function updateHistory(data) {
    if (!data || !Array.isArray(data.tasks) || !data.tasks.every(function (task) {
      return task && Number.isSafeInteger(task.issue_number) && task.issue_number > 0 &&
        typeof task.title === "string" && typeof task.status === "string";
    })) { throw { kind: "payload" }; }
    historyTasks = data.tasks;
    var selected = historyFilter.value;
    var statuses = historyTasks.map(function (task) { return task.status; });
    if (["all", "active", "terminal"].indexOf(selected) === -1) { statuses.push(selected); }
    historyFilter.textContent = "";
    ["all", "active", "terminal"].concat(statuses.filter(function (status, index) {
      return statuses.indexOf(status) === index;
    }).sort()).forEach(function (value) {
      var option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      historyFilter.appendChild(option);
    });
    if (Array.from(historyFilter.options).some(function (option) { return option.value === selected; })) {
      historyFilter.value = selected;
    }
    renderHistory();
  }

  function withToken(path) {
    var sep = path.indexOf("?") === -1 ? "?" : "&";
    return path + sep + "token=" + encodeURIComponent(token);
  }

  function fetchJson(path, options) {
    return fetch(withToken(path), options).catch(function () {
      throw { kind: "network" };
    }).then(function (res) {
      if (!res.ok) { throw { kind: "http", status: res.status }; }
      return res.json().catch(function () { throw { kind: "json" }; });
    });
  }

  function showBanner(message) {
    var el = document.getElementById("banner");
    if (!message) {
      el.classList.remove("show");
      el.textContent = "";
      return;
    }
    el.textContent = message;
    el.classList.add("show");
  }

  function showRequestError(error) {
    lastRevision = null;
    var message;
    if (error && error.kind === "http" && error.status === 403) {
      message = "Authentication expired. Open a new dashboard URL.";
    } else if (error && error.kind === "http") {
      message = "Dashboard request failed (HTTP " + error.status + ").";
    } else if (error && error.kind === "json") {
      message = "Dashboard returned invalid JSON.";
    } else if (error && error.kind === "status") {
      message = "Dashboard returned invalid status data.";
    } else if (error && error.kind === "payload") {
      message = "Dashboard returned invalid data.";
    } else {
      message = "Dashboard connection failed.";
    }
    showBanner(message + " Previously displayed data may be stale.");
  }

  function renderStatus(data) {
    if (data && data.error === "uninitialized") {
      lastRevision = null;
      showBanner("Repository is not initialized (configuration missing). Run `subsched init` first. " +
        "Previously displayed data may be stale.");
      return null;
    }
    if (data && data.error === "state_corrupted") {
      lastRevision = null;
      showBanner(
        "Scheduler state is invalid or was quarantined after corruption. Restore a verified backup and " +
          "run recovery before continuing. Previously displayed data may be stale."
      );
      return null;
    }
    if (!data || typeof data.paused !== "boolean" || !Number.isSafeInteger(data.queue_size) ||
        data.queue_size < 0 || !Number.isSafeInteger(data.revision) || data.revision < 0 ||
        !Array.isArray(data.active_tasks) ||
        !data.active_tasks.every(function (task) {
          return task && Number.isSafeInteger(task.issue_number) && task.issue_number > 0 &&
            typeof task.status === "string" && typeof task.title === "string";
        })) {
      throw { kind: "status" };
    }
    setLines(document.getElementById("status-summary"), [
      "Paused: " + data.paused,
      "Queue size: " + data.queue_size,
      "Revision: " + data.revision,
    ]);
    renderKanban(data.active_tasks || []);
    return data.revision;
  }

  function setLines(el, lines) {
    el.textContent = "";
    lines.forEach(function (line, index) {
      if (index > 0) { el.appendChild(document.createElement("br")); }
      el.appendChild(document.createTextNode(line));
    });
  }

  function renderKanban(tasks) {
    var key = JSON.stringify(tasks.map(function (task) {
      return [task.issue_number, task.title, task.status];
    }));
    if (key === lastKanban) { return; }
    var byStatus = Object.create(null);
    tasks.forEach(function (t) {
      byStatus[t.status] = byStatus[t.status] || [];
      byStatus[t.status].push(t);
    });
    var container = document.getElementById("kanban");
    var active = document.activeElement;
    var focusedIssue = active && container.contains(active) && active.classList.contains("task-chip")
      ? active.dataset.issue : null;
    var focusTarget = null;
    container.innerHTML = "";
    Object.keys(byStatus).sort().forEach(function (status) {
      var column = document.createElement("div");
      column.className = "column";
      var heading = document.createElement("h3");
      heading.textContent = status + " (" + byStatus[status].length + ")";
      column.appendChild(heading);
      byStatus[status].forEach(function (task) {
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "task-chip";
        chip.dataset.issue = String(task.issue_number);
        chip.textContent = "#" + task.issue_number + " " + task.title;
        chip.onclick = function () { loadDetail(task.issue_number); };
        if (chip.dataset.issue === focusedIssue) { focusTarget = chip; }
        column.appendChild(chip);
      });
      container.appendChild(column);
    });
    lastKanban = key;
    if (focusTarget) { focusTarget.focus(); }
  }

  function renderCapacity(data) {
    var el = document.getElementById("capacity-summary");
    var lines = (data.capacities || []).map(function (c) {
      return c.agent + ": " + c.state + (c.used_percentage != null ? " (" + c.used_percentage + "%)" : "");
    });
    if (lines.length === 0) {
      el.textContent = "no capacity data";
    } else {
      setLines(el, lines);
    }
  }

  function renderMetrics(data) {
    var m = data.metrics || {};
    var el = document.getElementById("metrics-summary");
    setLines(el, [
      "Attempted: " + (m.productivity ? m.productivity.issues_attempted : "-"),
      "Implemented: " + (m.productivity ? m.productivity.issues_implemented : "-"),
    ]);
  }

  function renderDiagnostics(body, data) {
    function value(item, fallback) {
      return (typeof item === "string" && item.length > 0) || typeof item === "number"
        ? String(item) : (fallback || "—");
    }
    var summary = document.createElement("div");
    setLines(summary, [
      "Status: " + value(data.status),
      "Agent: " + value(data.current_agent),
      "Stage: " + value(data.dispatch_stage),
      "Model: " + value(data.dispatch_model, "provider-default"),
      "Effort: " + value(data.dispatch_effort, "provider-default"),
      "PR: " + (Number.isSafeInteger(data.pr) ? "#" + data.pr : "—"),
      "CI: " + value(data.ci_result),
      "Completion: " + value(data.completion_kind),
      "Reason code: " + value(data.needs_human_reason_code),
      "Reason: " + value(data.needs_human_reason),
      "Resolution note: " + value(data.resolution_note),
      "Attempts: " + value(data.attempt),
      "Verification failures: " + value(data.verification_failures),
      "Review cycles: " + value(data.review_cycles),
      "Plan revisions: " + value(data.plan_revisions),
      "Capacity events: " + value(data.capacity_events),
      "Agent switches: " + value(data.actual_agent_switches),
    ]);
    body.appendChild(summary);
    var failures = document.createElement("p");
    var perAgent = data.per_agent_failures;
    failures.textContent = "Agent failures: " + (perAgent && typeof perAgent === "object" &&
      !Array.isArray(perAgent) ? Object.keys(perAgent).map(function (agent) {
        return agent + ": " + value(perAgent[agent]);
      }).join(", ") || "—" : "—");
    body.appendChild(failures);
    var commitsHeading = document.createElement("h4");
    commitsHeading.textContent = "Recent commits";
    body.appendChild(commitsHeading);
    var commits = document.createElement("pre");
    commits.textContent = Array.isArray(data.commit_log) && data.commit_log.length > 0 &&
      data.commit_log.every(function (line) { return typeof line === "string"; })
      ? data.commit_log.join("\n") : "(no recent commits)";
    body.appendChild(commits);
    var handoffHeading = document.createElement("h4");
    handoffHeading.textContent = "Handoff";
    body.appendChild(handoffHeading);
  }

  function loadDetail(issue) {
    var card = document.getElementById("detail-card");
    var body = document.getElementById("detail-body");
    if (selectedIssue !== issue) {
      selectedIssue = issue;
      card.style.display = "block";
      body.textContent = "Loading task #" + issue + "…";
    }
    var request = ++detailRequest;
    if (detailAbort !== null) { detailAbort.abort(); }
    var controller = new AbortController();
    detailAbort = controller;
    var timeout = setTimeout(function () { controller.abort(); }, 10000);
    return fetchJson("/api/tasks/" + encodeURIComponent(issue), { signal: controller.signal })
      .then(function (data) {
        if (request !== detailRequest || selectedIssue !== issue) { return false; }
        if (!data || data.issue_number !== issue || typeof data.title !== "string" ||
            (data.handoff !== null && typeof data.handoff !== "string")) {
          throw { kind: "payload" };
        }
        body.textContent = "";
        var heading = document.createElement("h3");
        heading.textContent = "#" + data.issue_number + " " + data.title;
        var pre = document.createElement("pre");
        pre.textContent = data.handoff || "(no handoff)";
        body.appendChild(heading);
        renderDiagnostics(body, data);
        body.appendChild(pre);
        return true;
      }).catch(function (error) {
        if (request !== detailRequest || selectedIssue !== issue) { return false; }
        body.textContent = "Task #" + issue + " is unavailable.";
        showRequestError(error);
        return false;
      }).finally(function () {
        clearTimeout(timeout);
        if (detailAbort === controller) { detailAbort = null; }
      });
  }

  function poll() {
    if (polling) { return; }
    polling = true;
    fetchJson("/api/status").then(function (data) {
      var revision = renderStatus(data);
      if (revision !== null && revision !== lastRevision) {
        return Promise.all([fetchJson("/api/capacity"), fetchJson("/api/metrics"), fetchJson("/api/tasks")])
          .then(function (results) {
            var capacity = results[0];
            var metrics = results[1] && results[1].metrics;
            var productivity = metrics && metrics.productivity;
            if (!capacity || capacity.error || !Array.isArray(capacity.capacities) ||
                !capacity.capacities.every(function (item) {
                  return item && typeof item.agent === "string" && typeof item.state === "string";
                }) || !productivity ||
                !Number.isSafeInteger(productivity.issues_attempted) ||
                productivity.issues_attempted < 0 ||
                !Number.isSafeInteger(productivity.issues_implemented) ||
                productivity.issues_implemented < 0) {
              throw { kind: "payload" };
            }
            updateHistory(results[2]);
            renderCapacity(results[0]);
            renderMetrics(results[1]);
            if (selectedIssue !== null) {
              return loadDetail(selectedIssue).then(function (updated) {
                if (!updated) { return; }
                lastRevision = revision;
                showBanner(null);
              });
            } else {
              lastRevision = revision;
              showBanner(null);
            }
          });
      }
      if (revision !== null) { showBanner(null); }
    }).catch(showRequestError).finally(function () { polling = false; });
  }

  poll();
  setInterval(poll, (window.__DASHBOARD_INTERVAL__ || 2) * 1000);
})();
</script>
</body>
</html>
